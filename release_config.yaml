# Production release configuration.
# See design_docs/production-build-spec.md (section 3).
#
# NOTE: This file is parsed by the scripts in scripts/release/ with a
# deliberately simple line-based parser. Keep the structure flat as shown
# here — two-space indentation, `key: value` pairs, no anchors or flow
# syntax.

app:
  # Human name used in release titles. Version comes from pubspec.yaml,
  # never from this file.
  display_name: "It's Just a Phase"
  # Filename-safe slug used to name build artifacts, e.g.
  # `<slug>-<version>-windows-x64.msix`. Lowercase, hyphenated.
  artifact_slug: its-just-a-phase

# Local sibling packages the release must pin before building. List one
# block per dependency under `dependencies:`; the release scripts sync
# every entry. Omit the section entirely for apps with no local
# dependencies.
dependencies:
  mvr:
    git: https://github.com/Charlie9830/mvr.git
    # A tag (preferred) or full commit SHA. Branch names are rejected by
    # preflight because they are not reproducible.
    ref: v0.1.0
    # Where the checkout must live, relative to this repo's root, so that
    # pubspec's `path: ../mvr/` resolves.
    path: ../mvr

# macOS signing and notarization. All three values must resolve to
# material already present on the build Mac; nothing secret lives here.
macos:
  # Full identity strings as shown by `security find-identity -v`. The
  # Application identity signs the .app (hardened runtime); the Installer
  # identity signs the .pkg via productbuild.
  application_identity: "Developer ID Application: Charlie Hall (7MGD5674RY)"
  installer_identity: "Developer ID Installer: Charlie Hall (7MGD5674RY)"
  # A notarytool credential profile created once with
  # `xcrun notarytool store-credentials`. NEVER put the app-specific
  # password in this file — only the profile name.
  notary_profile: notarytool

publish:
  github:
    # The separate binaries-only repository.
    repo: Charlie9830/Phase
    draft: true
    prerelease: false
