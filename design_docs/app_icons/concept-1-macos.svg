      <stop offset="0" stop-color="#232834"/>
      <stop offset="1" stop-color="#0E1015"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="183.3"/>
    </clipPath>
  </defs>
  <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="183.3"
