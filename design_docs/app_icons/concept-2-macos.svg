<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Concept 2: "Phase Dial" - macOS squircle variant. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#212631"/>
      <stop offset="1" stop-color="#0C0E13"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#B9C1CF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1024"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="183.3"/>
    </clipPath>
  </defs>
  <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="183.3"
        fill="url(#card)"/>
  <g clip-path="url(#cardClip)">
    <g transform="translate(102.4 102.4) scale(0.8)">
      <circle cx="512" cy="512" r="360" fill="none" stroke="url(#steel)"
              stroke-width="58" stroke-linecap="round"
              stroke-dasharray="2165.95 96" stroke-dashoffset="1648.46"/>
      <g fill="url(#amber)">
        <rect x="456" y="202" width="112" height="210" rx="56"/>
        <rect x="456" y="202" width="112" height="210" rx="56"
              transform="rotate(120 512 512)"/>
        <rect x="456" y="202" width="112" height="210" rx="56"
              transform="rotate(240 512 512)"/>
      </g>
    </g>
  </g>
  <rect x="103.9" y="103.9" width="816.2" height="816.2" rx="182"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
</svg>
